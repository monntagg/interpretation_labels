
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily CMoG Interpretive Label</title>
<style>
  :root {
    --ink:      #000;
    --ink-soft: #3a3a3a;
    --paper:    #fff;
  }

  * { box-sizing: border-box; }
  * { transition: none !important; animation: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Noto Serif", "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 4vh 5vw;
  }

  main {
    width: 100%;
    max-width: 60rem;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---- Image band. Height is set from JS via --image-share. ---- */

  .plate {
    flex: 0 0 auto;
    height: var(--image-share, 0%);
    width: 100%;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }
  .plate img {
    max-height: 100%;
    max-width: 100%;
    /* contain, never cover: the object is never cropped. */
    object-fit: contain;
    object-position: left center;
    display: block;
  }
  /* Collapsed state, used when there is no image or it failed to load. */
  .plate.empty {
    height: 0;
    margin-bottom: 0;
  }

  /* ---- Text. All rem, so scaling the root scales the lot. ---- */

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 2rem;
    margin: 0 0 2rem 0;
  }

  .area {
    font-size: 0.9rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }

  .toggle {
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  h1 {
    font-size: 2.8rem;
    line-height: 1.15;
    font-weight: normal;
    font-style: italic;
    margin: 0 0 1.1rem 0;
  }

  .tombstone {
    font-size: 1.1rem;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 1.6rem 0;
  }
  .tombstone .maker {
    color: var(--ink);
    font-variant: small-caps;
    letter-spacing: 0.04em;
    font-size: 1.25rem;
  }
  .tombstone div { margin-top: 0.1rem; }

  hr {
    border: 0;
    border-top: 1px solid var(--ink);
    margin: 0 0 1.6rem 0;
    width: 100%;
  }

  .label {
    font-size: 1.6rem;
    line-height: 1.6;
    margin: 0;
    max-width: 34em;
  }

  footer {
    margin-top: auto;
    padding-top: 2rem;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    gap: 2rem;
  }
  
  footer .accession { letter-spacing: 0.05em; }

    footer .toggle {
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--ink-soft);
    cursor: pointer;
  }

  footer a.accession {
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-soft);
  }

  .message {
    font-size: 1.2rem;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: auto 0;
    text-align: center;
  }
</style>
</head>
<body>
<main id="root">
  <p class="message">Loading&hellip;</p>
</main>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSJg7tG8-A64uJS8B1NO18BDy63lncDfqsGcy7ABosAnNZduhaNeciD2zL6X57LL4ZXSxaTQwh9K9Ae/pub?gid=0&single=true&output=csv";

var POLL_SECONDS = 300;

// Master switch. Set false for the text-only layout — the quickest
// possible rollback, no other edits needed.
var SHOW_IMAGE = true;

// Share of the screen height given to the object image.
var IMAGE_SHARE_PERCENT = 33;

// Auto-fit bounds for the root font size, in px.
var MIN_ROOT_PX = 9;
var MAX_ROOT_PX = 30;

// If an image hasn't loaded in this long, give up and lay out without it.
var IMAGE_TIMEOUT_MS = 12000;


/* ============================================================
   AUTO-FIT
   ============================================================ */

// Binary search for the largest root font size whose content still fits.
// Must run AFTER any image has loaded, or it measures against a
// zero-height box and picks a size that's far too large.
function fitToScreen() {
  var root = document.documentElement;
  var main = document.getElementById("root");

  var lo = MIN_ROOT_PX;
  var hi = MAX_ROOT_PX;
  var best = MIN_ROOT_PX;

  for (var i = 0; i < 9; i++) {
    var mid = (lo + hi) / 2;
    root.style.fontSize = mid + "px";

    if (main.scrollHeight > main.clientHeight - 4) {
      hi = mid;
    } else {
      best = mid;
      lo = mid;
    }
  }

  // Layout can settle slightly larger than measured. Step down until it fits.
  var guard = 0;
  while (main.scrollHeight > main.clientHeight && best > MIN_ROOT_PX && guard < 20) {
    best = best * 0.98;
    root.style.fontSize = best + "px";
    guard++;
  }
}

// Drop the image band entirely and re-fit the text into the full height.
function collapseImage() {
  var plate = document.querySelector(".plate");
  if (plate && !plate.classList.contains("empty")) {
    plate.classList.add("empty");
  }
  fitToScreen();
}


/* ============================================================
   CSV parsing
   ============================================================ */

function parseCSV(text) {
  var rows = [], row = [], field = "", inQuotes = false;

  for (var i = 0; i < text.length; i++) {
    var c = text.charAt(i);

    if (inQuotes) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field); field = "";
    } else if (c === "\n") {
      row.push(field); field = "";
      rows.push(row); row = [];
    } else if (c !== "\r") {
      field += c;
    }
  }
  row.push(field);

  var nonEmpty = false;
  for (var j = 0; j < row.length; j++) {
    if (row[j].replace(/\s/g, "") !== "") { nonEmpty = true; break; }
  }
  if (nonEmpty) rows.push(row);

  return rows;
}


/* ============================================================
   Rendering
   ============================================================ */

// Column K (index 10) is new.
var FIELDS = ["date", "object_number", "title", "maker", "object_date",
              "place", "technique", "label", "url", "collection_area",
              "image_url", "label_75"];

function toRecord(row) {
  var r = {};
  for (var i = 0; i < FIELDS.length; i++) {
    r[FIELDS[i]] = (row[i] || "").replace(/^\s+|\s+$/g, "");
  }
  return r;
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function present(v) {
  return v && v !== "\u2014" && v !== "-";
}

function usableImage(rec) {
  if (!SHOW_IMAGE) return false;
  if (!present(rec.image_url)) return false;
  // Only http(s) — refuse anything else outright.
  return /^https?:\/\//i.test(rec.image_url);
}

function render(rec) {
  var hasImage = usableImage(rec);
  var parts = [];

  parts.push('<div class="plate' + (hasImage ? '' : ' empty') + '">');
  if (hasImage) {
    parts.push('<img id="plate-img" alt="" src="' + esc(rec.image_url) + '">');
  }
  parts.push("</div>");

  var hasShort = present(rec.label_75);
  
  parts.push('<div class="header-row">');
  parts.push('<p class="area">' +
    (present(rec.collection_area) ? esc(rec.collection_area) : "") + "</p>");
  if (hasShort) {
    parts.push('<span class="toggle" id="version-toggle">' +
      (showShort ? "150 words" : "75 words") + "</span>");
  }
  parts.push("</div>");

  parts.push("<h1>" + esc(rec.title || "Untitled") + "</h1>");

  parts.push('<div class="tombstone">');
  if (present(rec.maker)) {
    parts.push('<div class="maker">' + esc(rec.maker) + "</div>");
  }
  var line = [];
  if (present(rec.object_date)) line.push(rec.object_date);
  if (present(rec.place)) line.push(rec.place);
  if (line.length) parts.push("<div>" + esc(line.join(", ")) + "</div>");
  if (present(rec.technique)) {
    parts.push("<div>" + esc(rec.technique) + "</div>");
  }
  
  parts.push("<hr>");


  var body = (showShort && hasShort) ? rec.label_75 : rec.label;
  parts.push('<p class="label">' + esc(body) + "</p>");

  if (hasShort) {
    parts.push('<span class="toggle" id="version-toggle">' +
      (showShort ? "150 words" : "75 words") + "</span>");
  }
  
  parts.push("<footer>");
  if (present(rec.object_number)) {
    parts.push(present(rec.url)
      ? '<a class="accession" href="' + esc(rec.url) + '">' + esc(rec.object_number) + "</a>"
      : '<span class="accession">' + esc(rec.object_number) + "</span>");
  }
  if (present(rec.date)) parts.push("<span>" + esc(rec.date) + "</span>");
  parts.push("</footer>");

  document.getElementById("root").innerHTML = parts.join("");

  if (!hasImage) {
    document.documentElement.style.setProperty("--image-share", "0%");
    fitToScreen();
    return;
  }

  document.documentElement.style.setProperty(
    "--image-share", IMAGE_SHARE_PERCENT + "%");

  var img = document.getElementById("plate-img");
  var settled = false;

  function settle(ok) {
    if (settled) return;
    settled = true;
    if (ok) { fitToScreen(); } else { collapseImage(); }
  }

  // Cached images may already be complete by the time we attach handlers.
  if (img.complete && img.naturalWidth > 0) {
    settle(true);
    return;
  }

  img.onload = function () { settle(true); };
  img.onerror = function () { settle(false); };

  // Backstop: a hung request shouldn't leave a blank band forever.
  setTimeout(function () {
    if (!settled) {
      if (img.complete && img.naturalWidth > 0) { settle(true); }
      else { settle(false); }
    }
  }, IMAGE_TIMEOUT_MS);
}

function showMessage(text) {
  document.documentElement.style.fontSize = "16px";
  document.documentElement.style.setProperty("--image-share", "0%");
  document.getElementById("root").innerHTML =
    '<p class="message">' + esc(text) + "</p>";
}


/* ============================================================
   Polling
   ============================================================ */

var currentKey = null;
var lastGood = null;

// Which label version to show. ?v=75 in the URL sets the short one as
// this device's default; the footer toggle overrides per-viewing.
var showShort = /[?&]v=75\b/.test(window.location.search);

function check() {
  if (CSV_URL.indexOf("PASTE_") === 0) {
    showMessage("Set CSV_URL at the top of the script block.");
    return;
  }

  fetch(CSV_URL + "&_=" + Date.now(), { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function (text) {
      var rows = parseCSV(text);

      var data = [];
      for (var i = 1; i < rows.length; i++) {
        if ((rows[i][7] || "").replace(/\s/g, "") !== "") data.push(rows[i]);
      }

      if (!data.length) {
        if (!lastGood) showMessage("No labels in the sheet yet.");
        return;
      }

      var rec = toRecord(data[data.length - 1]);
      var key = rec.date + "|" + rec.object_number;

      if (key !== currentKey) {
        render(rec);
        currentKey = key;
        lastGood = rec;
      }
    })
    .catch(function (err) {
      if (!lastGood) showMessage("Could not reach the sheet. Retrying\u2026");
      if (window.console) console.error(err);
    });
}

check();
setInterval(check, POLL_SECONDS * 1000);

var resizeTimer = null;
function onResize() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    if (lastGood) fitToScreen();
  }, 250);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

document.addEventListener("click", function (e) {
  if (e.target && e.target.id === "version-toggle") {
    showShort = !showShort;
    if (lastGood) render(lastGood);
    return;
  }
  currentKey = null;
  check();
});
</script>
</body>
</html>
